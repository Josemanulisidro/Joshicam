<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-label="Ilustración de seguridad: casa con cámara, cerca eléctrica, portón automático y alarma" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#112a52"/>
      <stop offset="1" stop-color="#0a1931"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2f6bff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d8bff"/>
      <stop offset="1" stop-color="#1c46b8"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C15E" stop-opacity=".45"/>
      <stop offset="1" stop-color="#22C15E" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6f94d8" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <style>
      .led { animation: blink 1.6s ease-in-out infinite; }
      .ring { transform-origin: 400px 190px; animation: pulse 3.2s ease-out infinite; }
      .ring.r2 { animation-delay: 1.6s; }
      .siren { animation: blink 1s steps(2, end) infinite; }
      @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
      @keyframes pulse { 0% { transform: scale(.7); opacity: .7 } 100% { transform: scale(1.9); opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .led, .ring, .siren { animation: none } }
    </style>
  </defs>

  <!-- Fondo -->
  <rect width="800" height="640" rx="24" fill="url(#bg)"/>
  <rect width="800" height="640" rx="24" fill="url(#grid)"/>
  <circle cx="400" cy="190" r="230" fill="url(#glow)"/>

  <!-- Anillos de señal -->
  <circle class="ring" cx="400" cy="190" r="90" fill="none" stroke="#4d8bff" stroke-width="2"/>
  <circle class="ring r2" cx="400" cy="190" r="90" fill="none" stroke="#4d8bff" stroke-width="2"/>
  <circle cx="400" cy="190" r="150" fill="none" stroke="#4d8bff" stroke-opacity=".25" stroke-dasharray="4 10"/>

  <!-- Escudo -->
  <path d="M400 92 L476 118 V182 C476 230 444 262 400 284 C356 262 324 230 324 182 V118 Z"
        fill="url(#shield)" stroke="#9cc0ff" stroke-width="3"/>
  <path d="M400 108 L462 130 V182 C462 220 436 247 400 266 C364 247 338 220 338 182 V130 Z"
        fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="2"/>
  <path d="M366 190 L392 216 L440 160" fill="none" stroke="#22C15E" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Alarma / sirena -->
  <g transform="translate(640 90)">
    <rect x="0" y="62" width="76" height="14" rx="4" fill="#1b3b6e" stroke="#4d8bff"/>
    <path d="M10 62 a28 28 0 0 1 56 0 Z" fill="#ff4d4d" class="siren"/>
    <path d="M10 62 a28 28 0 0 1 56 0 Z" fill="none" stroke="#ffb3b3" stroke-opacity=".6"/>
    <path d="M-12 30 q-10 14 0 28 M-26 22 q-18 22 0 44" fill="none" stroke="#ff7a7a" stroke-width="3" stroke-linecap="round" class="siren"/>
    <path d="M88 30 q10 14 0 28 M102 22 q18 22 0 44" fill="none" stroke="#ff7a7a" stroke-width="3" stroke-linecap="round" class="siren"/>
  </g>

  <!-- Conexión cámara - escudo -->
  <path d="M410 392 C 470 330, 450 300, 420 280" fill="none" stroke="#4d8bff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- Suelo -->
  <rect x="0" y="520" width="800" height="120" fill="#081426"/>
  <path d="M0 520H800" stroke="#2f6bff" stroke-opacity=".5" stroke-width="2"/>

  <!-- Haz de la cámara -->
  <polygon points="428,408 760,452 760,520 428,420" fill="url(#beam)"/>

  <!-- Casa -->
  <polygon points="120,368 260,262 400,368" fill="#1b3b6e" stroke="#4d8bff" stroke-width="2" stroke-linejoin="round"/>
  <rect x="150" y="368" width="220" height="152" fill="#13294d" stroke="#4d8bff" stroke-width="2"/>
  <rect x="236" y="436" width="48" height="84" rx="4" fill="#0a1931" stroke="#4d8bff" stroke-width="2"/>
  <circle cx="274" cy="480" r="3" fill="#22C15E"/>
  <rect x="172" y="394" width="48" height="38" rx="3" fill="#ffd166" fill-opacity=".85"/>
  <rect x="300" y="394" width="48" height="38" rx="3" fill="#ffd166" fill-opacity=".85"/>
  <path d="M196 394V432M172 413H220M324 394V432M300 413H348" stroke="#13294d" stroke-width="2"/>

  <!-- Cámara en la pared -->
  <path d="M370 392 H392" stroke="#9cc0ff" stroke-width="6" stroke-linecap="round"/>
  <g transform="rotate(14 388 400)">
    <rect x="384" y="388" width="50" height="24" rx="6" fill="#e8f0ff" stroke="#4d8bff" stroke-width="2"/>
    <rect x="424" y="391" width="10" height="18" rx="3" fill="#0a1931"/>
    <circle cx="429" cy="400" r="4" fill="#4d8bff"/>
    <circle class="led" cx="396" cy="394" r="3" fill="#ff4d4d"/>
  </g>

  <!-- Cerca eléctrica -->
  <g>
    <g fill="#13294d" stroke="#4d8bff" stroke-width="2">
      <rect x="436" y="418" width="10" height="102" rx="2"/>
      <rect x="500" y="418" width="10" height="102" rx="2"/>
      <rect x="660" y="418" width="10" height="102" rx="2"/>
      <rect x="724" y="418" width="10" height="102" rx="2"/>
    </g>
    <g stroke="#9cc0ff" stroke-width="2" fill="none">
      <path d="M446 436H500M446 466H500M446 496H500"/>
      <path d="M670 436H724M670 466H724M670 496H724"/>
    </g>
    <g fill="#ffd166">
      <path d="M470 436 l-5 -10 l6 3 l-3 -9 l8 10 l-6 -2 z" class="led"/>
      <path d="M700 466 l-5 -10 l6 3 l-3 -9 l8 10 l-6 -2 z" class="led"/>
    </g>
  </g>

  <!-- Portón automático -->
  <g>
    <rect x="510" y="440" width="150" height="80" rx="4" fill="#0f2548" stroke="#4d8bff" stroke-width="2"/>
    <g stroke="#4d8bff" stroke-opacity=".8" stroke-width="3">
      <path d="M535 440V520M560 440V520M585 440V520M610 440V520M635 440V520"/>
    </g>
    <path d="M510 462H660M510 498H660" stroke="#9cc0ff" stroke-width="3"/>
    <rect x="660" y="476" width="22" height="30" rx="4" fill="#1b3b6e" stroke="#22C15E" stroke-width="2"/>
    <circle class="led" cx="671" cy="484" r="3.5" fill="#22C15E"/>
    <path d="M540 424 h50 m-10 -8 l10 8 l-10 8" fill="none" stroke="#22C15E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Detalles -->
  <g fill="#9cc0ff" fill-opacity=".5">
    <circle cx="70" cy="90" r="3"/><circle cx="120" cy="150" r="2"/><circle cx="210" cy="70" r="2.5"/>
    <circle cx="560" cy="60" r="2"/><circle cx="740" cy="250" r="3"/><circle cx="60" cy="300" r="2"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
