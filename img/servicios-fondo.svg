<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Cuatro servicios de seguridad conectados: cámaras, cerca eléctrica, portón automático y alarma" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2244"/>
      <stop offset="1" stop-color="#0a1931"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2f6bff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d8bff"/>
      <stop offset="1" stop-color="#1c46b8"/>
    </linearGradient>
    <linearGradient id="trace" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="800" y2="0">
      <stop offset="0" stop-color="#4d8bff" stop-opacity="0"/>
      <stop offset="1" stop-color="#4d8bff" stop-opacity=".55"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6f94d8" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <style>
      .led { animation: blink 1.6s ease-in-out infinite; }
      .siren { animation: blink 1s steps(2, end) infinite; }
      .ring { transform-origin: 930px 300px; animation: pulse 3.4s ease-out infinite; }
      .ring.r2 { animation-delay: 1.7s; }
      .flow { animation: flow 2.4s linear infinite; }
      @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
      @keyframes pulse { 0% { transform: scale(.8); opacity: .7 } 100% { transform: scale(2.4); opacity: 0 } }
      @keyframes flow { to { stroke-dashoffset: -28 } }
      @media (prefers-reduced-motion: reduce) { .led, .ring, .siren, .flow { animation: none } }
    </style>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  <circle cx="930" cy="300" r="300" fill="url(#glow)"/>

  <!-- Trazas tipo plano hacia la izquierda (se desvanecen) -->
  <g fill="none" stroke="url(#trace)" stroke-width="2">
    <path d="M770 190 H640 L600 150 H380"/>
    <path d="M770 410 H620 L580 450 H300"/>
    <path d="M886 300 H520 L480 340 H200"/>
    <path d="M840 120 V60 H560"/>
    <path d="M840 480 V540 H520"/>
  </g>
  <g fill="#0a1931" stroke="#4d8bff" stroke-opacity=".6" stroke-width="2">
    <circle cx="380" cy="150" r="5"/>
    <circle cx="300" cy="450" r="5"/>
    <circle cx="200" cy="340" r="5"/>
    <circle cx="560" cy="60" r="5"/>
    <circle cx="520" cy="540" r="5"/>
  </g>

  <!-- Anillos de pulso del centro -->
  <circle class="ring" cx="930" cy="300" r="50" fill="none" stroke="#4d8bff" stroke-width="2"/>
  <circle class="ring r2" cx="930" cy="300" r="50" fill="none" stroke="#4d8bff" stroke-width="2"/>

  <!-- Conexiones del centro a cada servicio -->
  <g stroke="#4d8bff" stroke-opacity=".7" stroke-width="2" stroke-dasharray="6 8" fill="none">
    <path class="flow" d="M930 300 L840 190"/>
    <path class="flow" d="M930 300 L1020 190"/>
    <path class="flow" d="M930 300 L840 410"/>
    <path class="flow" d="M930 300 L1020 410"/>
  </g>

  <!-- Servicio 1: cámara -->
  <g transform="translate(770 120)">
    <rect width="140" height="140" rx="22" fill="#13294d" stroke="#2f6bff" stroke-width="2"/>
    <path d="M34 71 H22 V104" fill="none" stroke="#9cc0ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="rotate(12 70 70)">
      <rect x="34" y="56" width="62" height="30" rx="8" fill="#e8f0ff" stroke="#4d8bff" stroke-width="2"/>
      <rect x="86" y="60" width="14" height="22" rx="4" fill="#0a1931"/>
      <circle cx="93" cy="71" r="5" fill="#4d8bff"/>
      <circle class="led" cx="46" cy="64" r="3.5" fill="#ff4d4d"/>
    </g>
  </g>

  <!-- Servicio 2: cerca eléctrica -->
  <g transform="translate(950 120)">
    <rect width="140" height="140" rx="22" fill="#13294d" stroke="#2f6bff" stroke-width="2"/>
    <g fill="#1b3b6e" stroke="#4d8bff" stroke-width="2">
      <rect x="26" y="32" width="10" height="78" rx="2"/>
      <rect x="104" y="32" width="10" height="78" rx="2"/>
    </g>
    <path d="M36 52H104M36 72H104M36 92H104" stroke="#9cc0ff" stroke-width="2.5" fill="none"/>
    <path class="led" d="M75 44 L61 74 H72 L65 100 L86 68 H74 Z" fill="#ffd166"/>
  </g>

  <!-- Servicio 3: portón automático -->
  <g transform="translate(770 340)">
    <rect width="140" height="140" rx="22" fill="#13294d" stroke="#2f6bff" stroke-width="2"/>
    <rect x="16" y="58" width="90" height="50" rx="4" fill="#0f2548" stroke="#4d8bff" stroke-width="2"/>
    <path d="M34 58V108M52 58V108M70 58V108M88 58V108" stroke="#4d8bff" stroke-opacity=".85" stroke-width="3"/>
    <path d="M16 72H106M16 94H106" stroke="#9cc0ff" stroke-width="3"/>
    <rect x="110" y="72" width="14" height="36" rx="4" fill="#1b3b6e" stroke="#22C15E" stroke-width="2"/>
    <circle class="led" cx="117" cy="80" r="3" fill="#22C15E"/>
    <path d="M30 40 h56 m-10 -8 l10 8 l-10 8" fill="none" stroke="#22C15E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Servicio 4: alarma -->
  <g transform="translate(950 340)">
    <rect width="140" height="140" rx="22" fill="#13294d" stroke="#2f6bff" stroke-width="2"/>
    <rect x="40" y="92" width="60" height="12" rx="4" fill="#1b3b6e" stroke="#4d8bff" stroke-width="2"/>
    <path class="siren" d="M46 92 a24 24 0 0 1 48 0 Z" fill="#ff4d4d"/>
    <g class="siren" fill="none" stroke="#ff7a7a" stroke-width="3" stroke-linecap="round">
      <path d="M30 62 q-10 12 0 24 M18 54 q-16 20 0 40"/>
      <path d="M110 62 q10 12 0 24 M122 54 q16 20 0 40"/>
    </g>
  </g>

  <!-- Centro: un solo proveedor -->
  <circle cx="930" cy="300" r="62" fill="none" stroke="#4d8bff" stroke-opacity=".5" stroke-dasharray="4 8"/>
  <circle cx="930" cy="300" r="44" fill="url(#hub)" stroke="#9cc0ff" stroke-width="3"/>
  <path d="M912 302 L925 315 L950 284" fill="none" stroke="#22C15E" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Detalles -->
  <g fill="#9cc0ff" fill-opacity=".5">
    <circle cx="120" cy="90" r="3"/><circle cx="260" cy="230" r="2"/><circle cx="460" cy="110" r="2.5"/>
    <circle cx="1140" cy="80" r="3"/><circle cx="1150" cy="520" r="2.5"/><circle cx="640" cy="500" r="2"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
