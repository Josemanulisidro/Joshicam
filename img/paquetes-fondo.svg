<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Paquetes de seguridad para hogar, negocio y empresa protegidos por un mismo escudo" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1931"/>
      <stop offset="1" stop-color="#10294f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2f6bff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d8bff"/>
      <stop offset="1" stop-color="#1c46b8"/>
    </linearGradient>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="720" y2="0">
      <stop offset="0" stop-color="#13294d" stop-opacity="0"/>
      <stop offset="1" stop-color="#13294d" stop-opacity=".9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6f94d8" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <g id="cam">
      <path d="M-12 -1 H2" stroke="#9cc0ff" stroke-width="5" stroke-linecap="round"/>
      <rect x="0" y="-12" width="40" height="22" rx="6" fill="#e8f0ff" stroke="#4d8bff" stroke-width="2"/>
      <rect x="32" y="-9" width="9" height="16" rx="3" fill="#0a1931"/>
      <circle cx="36" cy="-1" r="3.5" fill="#4d8bff"/>
      <circle class="led" cx="8" cy="-6" r="2.8" fill="#ff4d4d"/>
    </g>
    <style>
      .led { animation: blink 1.6s ease-in-out infinite; }
      .siren { animation: blink 1s steps(2, end) infinite; }
      .ring { transform-origin: 950px 130px; animation: pulse 3.4s ease-out infinite; }
      .ring.r2 { animation-delay: 1.7s; }
      .flow { animation: flow 2.4s linear infinite; }
      @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
      @keyframes pulse { 0% { transform: scale(.7); opacity: .7 } 100% { transform: scale(2.2); opacity: 0 } }
      @keyframes flow { to { stroke-dashoffset: -28 } }
      @media (prefers-reduced-motion: reduce) { .led, .ring, .siren, .flow { animation: none } }
    </style>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  <circle cx="950" cy="170" r="320" fill="url(#glow)"/>

  <!-- Ciudad lejana (se desvanece hacia la izquierda) -->
  <g fill="url(#sky)">
    <rect x="120" y="430" width="50" height="90"/>
    <rect x="180" y="380" width="40" height="140"/>
    <rect x="230" y="450" width="60" height="70"/>
    <rect x="300" y="350" width="45" height="170"/>
    <rect x="355" y="420" width="70" height="100"/>
    <rect x="435" y="390" width="40" height="130"/>
    <rect x="485" y="440" width="60" height="80"/>
    <rect x="555" y="370" width="50" height="150"/>
    <rect x="615" y="425" width="60" height="95"/>
    <rect x="685" y="460" width="45" height="60"/>
  </g>

  <!-- Suelo -->
  <rect x="0" y="520" width="1200" height="80" fill="#081426"/>
  <path d="M0 520H1200" stroke="#2f6bff" stroke-opacity=".5" stroke-width="2"/>

  <!-- Círculos de cobertura -->
  <circle cx="950" cy="130" r="210" fill="none" stroke="#4d8bff" stroke-opacity=".25" stroke-dasharray="4 10"/>
  <circle cx="950" cy="130" r="340" fill="none" stroke="#4d8bff" stroke-opacity=".15" stroke-dasharray="4 10"/>
  <circle class="ring" cx="950" cy="130" r="80" fill="none" stroke="#4d8bff" stroke-width="2"/>
  <circle class="ring r2" cx="950" cy="130" r="80" fill="none" stroke="#4d8bff" stroke-width="2"/>

  <!-- Líneas del escudo a cada perfil -->
  <g fill="none" stroke="#4d8bff" stroke-opacity=".7" stroke-width="2" stroke-dasharray="6 8">
    <path class="flow" d="M950 224 C950 290 800 280 800 342"/>
    <path class="flow" d="M950 224 V366"/>
    <path class="flow" d="M950 224 C950 280 1090 270 1090 332"/>
  </g>
  <g fill="#0a1931" stroke="#4d8bff" stroke-width="2">
    <circle cx="800" cy="346" r="5"/>
    <circle cx="950" cy="370" r="5"/>
    <circle cx="1090" cy="336" r="5"/>
  </g>

  <!-- Escudo -->
  <g transform="translate(550 -60)">
    <path d="M400 92 L476 118 V182 C476 230 444 262 400 284 C356 262 324 230 324 182 V118 Z" fill="url(#shield)" stroke="#9cc0ff" stroke-width="3"/>
    <path d="M400 108 L462 130 V182 C462 220 436 247 400 266 C364 247 338 220 338 182 V130 Z" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="2"/>
    <path d="M366 190 L392 216 L440 160" fill="none" stroke="#22C15E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Hogar -->
  <g>
    <polygon points="735,410 800,350 865,410" fill="#1b3b6e" stroke="#4d8bff" stroke-width="2" stroke-linejoin="round"/>
    <rect x="750" y="410" width="100" height="110" fill="#13294d" stroke="#4d8bff" stroke-width="2"/>
    <rect x="785" y="455" width="30" height="65" rx="3" fill="#0a1931" stroke="#4d8bff" stroke-width="2"/>
    <circle cx="809" cy="490" r="2.5" fill="#22C15E"/>
    <rect x="760" y="428" width="20" height="22" rx="2" fill="#ffd166" fill-opacity=".85"/>
    <rect x="820" y="428" width="20" height="22" rx="2" fill="#ffd166" fill-opacity=".85"/>
    <use href="#cam" xlink:href="#cam" transform="translate(826 414) scale(.8) rotate(14)"/>
  </g>

  <!-- Negocio -->
  <g>
    <rect x="890" y="370" width="100" height="150" fill="#13294d" stroke="#4d8bff" stroke-width="2"/>
    <rect x="900" y="378" width="80" height="16" rx="3" fill="#1b3b6e" stroke="#4d8bff"/>
    <g>
      <rect x="880" y="400" width="30" height="26" fill="#2f6bff"/>
      <rect x="910" y="400" width="30" height="26" fill="#9cc0ff"/>
      <rect x="940" y="400" width="30" height="26" fill="#2f6bff"/>
      <rect x="970" y="400" width="30" height="26" fill="#9cc0ff"/>
    </g>
    <rect x="900" y="444" width="50" height="62" rx="3" fill="#ffd166" fill-opacity=".85"/>
    <path d="M925 444V506M900 475H950" stroke="#13294d" stroke-width="2"/>
    <rect x="958" y="450" width="24" height="70" rx="3" fill="#0a1931" stroke="#4d8bff" stroke-width="2"/>
    <g transform="translate(1004 396)">
      <rect x="-8" y="12" width="16" height="8" rx="2" fill="#1b3b6e" stroke="#4d8bff"/>
      <path class="siren" d="M-9 12 a9 9 0 0 1 18 0 Z" fill="#ff4d4d"/>
      <path class="siren" d="M14 2 q6 6 0 12 M20 -2 q10 10 0 20" fill="none" stroke="#ff7a7a" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Empresa / planta -->
  <g>
    <rect x="1128" y="262" width="16" height="96" fill="#1b3b6e" stroke="#4d8bff" stroke-width="2"/>
    <g fill="#9cc0ff" fill-opacity=".25">
      <circle cx="1140" cy="246" r="9"/><circle cx="1150" cy="226" r="12"/><circle cx="1164" cy="204" r="14"/>
    </g>
    <polygon points="1025,370 1025,335 1060,358 1060,335 1095,358 1095,335 1130,358 1130,335 1157,358 1157,370" fill="#1b3b6e" stroke="#4d8bff" stroke-width="2" stroke-linejoin="round"/>
    <rect x="1025" y="370" width="132" height="150" fill="#13294d" stroke="#4d8bff" stroke-width="2"/>
    <g fill="#ffd166" fill-opacity=".85">
      <rect x="1038" y="388" width="18" height="14" rx="2"/><rect x="1064" y="388" width="18" height="14" rx="2"/>
      <rect x="1090" y="388" width="18" height="14" rx="2"/><rect x="1116" y="388" width="18" height="14" rx="2"/>
    </g>
    <rect x="1050" y="440" width="56" height="80" rx="3" fill="#0f2548" stroke="#4d8bff" stroke-width="2"/>
    <path d="M1050 458H1106M1050 476H1106M1050 494H1106" stroke="#4d8bff" stroke-opacity=".8" stroke-width="2"/>
    <rect x="1120" y="470" width="24" height="50" rx="3" fill="#0a1931" stroke="#4d8bff" stroke-width="2"/>
    <use href="#cam" xlink:href="#cam" transform="translate(1034 388) scale(-.8 .8) rotate(14)"/>
  </g>

  <!-- Cerca eléctrica perimetral -->
  <g>
    <g fill="#13294d" stroke="#4d8bff" stroke-width="2">
      <rect x="716" y="490" width="7" height="30" rx="1.5"/>
      <rect x="876" y="490" width="7" height="30" rx="1.5"/>
      <rect x="1006" y="490" width="7" height="30" rx="1.5"/>
      <rect x="1170" y="490" width="7" height="30" rx="1.5"/>
    </g>
    <path d="M723 500H1170M723 512H1170" stroke="#9cc0ff" stroke-opacity=".7" stroke-width="2" fill="none"/>
    <path class="led" d="M944 486 l-5 -10 l6 3 l-3 -9 l8 10 l-6 -2 z" fill="#ffd166"/>
  </g>

  <!-- Detalles -->
  <g fill="#9cc0ff" fill-opacity=".5">
    <circle cx="90" cy="80" r="3"/><circle cx="240" cy="160" r="2"/><circle cx="430" cy="70" r="2.5"/>
    <circle cx="640" cy="130" r="2"/><circle cx="1150" cy="70" r="3"/><circle cx="700" cy="300" r="2"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
